<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131e" />
      <stop offset="100%" stop-color="#040912" />
    </linearGradient>
    <pattern id="cloudGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#cloudBg)" />
  <rect width="800" height="480" fill="url(#cloudGrid)" />

  <!-- Technical Header Bar -->
  <rect x="30" y="24" width="740" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
  <circle cx="56" cy="46" r="5" fill="#ef4444" />
  <circle cx="74" cy="46" r="5" fill="#f59e0b" />
  <circle cx="92" cy="46" r="5" fill="#10b981" />
  <text x="120" y="50" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94a3b8">ml_pipeline :: atmospheric_pressure_classifier.py</text>
  <rect x="635" y="34" width="120" height="24" rx="4" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="0.8" />
  <text x="695" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399" text-anchor="middle" font-weight="600">INFERENCE READY</text>

  <!-- Step 1: Meteorological Telemetry Ingestion -->
  <rect x="40" y="100" width="210" height="160" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="40" y="100" width="210" height="32" rx="8" fill="#1e293b" />
  <text x="55" y="122" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" font-weight="bold">01 :: DATA INGESTION</text>
  <text x="55" y="152" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• Atmospheric Barometric P</text>
  <text x="55" y="174" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• Relative Humidity (%)</text>
  <text x="55" y="196" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• Surface Dew Point Temp</text>
  <text x="55" y="218" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• Wind Shear Velocity</text>
  <text x="55" y="240" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Pandas EDA &amp; Imputation</text>

  <!-- Flow 1 to 2 -->
  <path d="M 250 180 L 290 180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="290,176 300,180 290,184" fill="#38bdf8" />

  <!-- Step 2: Feature Selection & ML Models -->
  <rect x="300" y="90" width="240" height="180" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
  <rect x="300" y="90" width="240" height="34" rx="8" fill="#0369a1" fill-opacity="0.3" />
  <text x="315" y="113" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" font-weight="bold">02 :: MODEL TRAINING</text>
  <text x="315" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f8fafc">• Random Forest Classifier</text>
  <text x="315" y="167" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f8fafc">• Logistic Regression Baseline</text>
  <text x="315" y="189" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">• Correlation Matrix Tuning</text>
  <text x="315" y="211" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">• K-Fold Cross Validation</text>
  <text x="315" y="233" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">• Precision-Recall Curves</text>
  <text x="315" y="255" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">Scikit-Learn Optimization</text>

  <!-- Flow 2 to 3 -->
  <path d="M 540 180 L 580 180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="580,176 590,180 580,184" fill="#38bdf8" />

  <!-- Step 3: Early Warning Alerting Output -->
  <rect x="590" y="100" width="170" height="160" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="590" y="100" width="170" height="32" rx="8" fill="#1e293b" />
  <text x="605" y="122" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" font-weight="bold">03 :: DETECTION</text>
  <text x="605" y="152" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• Event Classification</text>
  <text x="605" y="174" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• Probability &gt; 0.88</text>
  <text x="605" y="196" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">• Flash Flood Advisory</text>
  <text x="605" y="218" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• Geo-telemetry Feed</text>

  <!-- Bottom Panel: Radar & Metrics Telemetry -->
  <rect x="40" y="290" width="720" height="160" rx="8" fill="#0a0f1d" stroke="#1e293b" stroke-width="1" />

  <!-- Confusion Matrix Graphic -->
  <g transform="translate(60, 310)">
    <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" font-weight="bold">CLASSIFICATION METRICS</text>
    <rect x="0" y="30" width="70" height="40" fill="#065f46" rx="4" />
    <text x="35" y="55" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">TP: 94%</text>
    <rect x="75" y="30" width="70" height="40" fill="#1e293b" rx="4" />
    <text x="110" y="55" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">FP: 6%</text>
    <rect x="0" y="75" width="70" height="40" fill="#1e293b" rx="4" />
    <text x="35" y="100" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">FN: 4%</text>
    <rect x="75" y="75" width="70" height="40" fill="#065f46" rx="4" />
    <text x="110" y="100" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">TN: 96%</text>
  </g>

  <!-- Atmospheric Waveform Chart -->
  <g transform="translate(260, 310)">
    <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">BAROMETRIC PRESSURE DROP DETECTOR (hPa)</text>
    <path d="M 0 60 Q 60 55, 120 70 T 240 110 T 360 40 T 450 65" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="0" y1="95" x2="450" y2="95" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="360" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ef4444">CRITICAL THRESHOLD</text>
    <!-- Point of drop -->
    <circle cx="240" cy="110" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1" />
    <text x="210" y="130" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ef4444" font-weight="bold">Rapid ΔP Anomaly</text>
  </g>
</svg>
