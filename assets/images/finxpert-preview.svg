<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>
    <pattern id="finGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#finBg)" />
  <rect width="800" height="480" fill="url(#finGrid)" />

  <!-- Technical Header -->
  <rect x="30" y="24" width="740" height="44" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1.2" />
  <circle cx="56" cy="46" r="5" fill="#ef4444" />
  <circle cx="74" cy="46" r="5" fill="#f59e0b" />
  <circle cx="92" cy="46" r="5" fill="#10b981" />
  <text x="120" y="50" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94a3b8">finxpert :: failover_stream_pipeline [FinEdge Hackathon Team Engine]</text>
  <rect x="620" y="34" width="135" height="24" rx="4" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="0.8" />
  <text x="687" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="600">HIGH AVAILABILITY</text>

  <!-- Flow Block 1: HyperTrade API & Ingestion -->
  <rect x="40" y="100" width="200" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="40" y="100" width="200" height="32" rx="8" fill="#1e293b" />
  <text x="55" y="122" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" font-weight="bold">01 :: MARKET FEED</text>
  <text x="55" y="152" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• HyperTrade Stream</text>
  <text x="55" y="174" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• Volatility Index (VIX)</text>
  <text x="55" y="196" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• Order Book Snapshots</text>
  <text x="55" y="218" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• Rate-Limit Monitor</text>

  <!-- Flow 1 to 2 -->
  <path d="M 240 175 L 290 175" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="290,171 300,175 290,179" fill="#38bdf8" />

  <!-- Flow Block 2: Failover Caching Pipeline (My Contribution) -->
  <rect x="300" y="90" width="240" height="170" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
  <rect x="300" y="90" width="240" height="34" rx="8" fill="#0369a1" fill-opacity="0.3" />
  <text x="315" y="113" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" font-weight="bold">02 :: FAILOVER CACHE</text>
  <text x="315" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f8fafc">• Resilient In-Memory Buffer</text>
  <text x="315" y="167" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f8fafc">• Network Fallback Guard</text>
  <text x="315" y="189" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">• Zero Stale State Policy</text>
  <text x="315" y="211" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">• Async Stream Throttling</text>
  <text x="315" y="233" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">Lead Backend Architecture</text>

  <!-- Flow 2 to 3 -->
  <path d="M 540 175 L 590 175" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="590,171 600,175 590,179" fill="#38bdf8" />

  <!-- Flow Block 3: Signal Analytics & Risk Profiles -->
  <rect x="600" y="100" width="160" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="600" y="100" width="160" height="32" rx="8" fill="#1e293b" />
  <text x="615" y="122" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" font-weight="bold">03 :: ANALYTICS</text>
  <text x="615" y="152" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• EMA (9, 21, 50)</text>
  <text x="615" y="174" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• RSI 14 Momentum</text>
  <text x="615" y="196" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• Volatility Bands</text>
  <text x="615" y="218" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">• Risk Rating Engine</text>

  <!-- Bottom Panel: Financial Candlesticks & Technical Signals -->
  <rect x="40" y="280" width="720" height="170" rx="8" fill="#0a0e1c" stroke="#1e293b" stroke-width="1" />

  <!-- Terminal Telemetry -->
  <g transform="translate(60, 305)">
    <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" font-weight="bold">MARKET SIGNAL METRICS</text>
    <text x="0" y="38" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">RSI (14): <tspan fill="#34d399">43.2 (Neutral / Bullish Divergence)</tspan></text>
    <text x="0" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">EMA 21/50 Cross: <tspan fill="#38bdf8">Golden Convergence Detected</tspan></text>
    <text x="0" y="78" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Cache Latency: <tspan fill="#34d399">0.84ms (Failover Standby)</tspan></text>
    <text x="0" y="98" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Risk Score Profile: <tspan fill="#f59e0b">Moderate Risk [Rank: B+]</tspan></text>
  </g>

  <!-- Candlestick Visual -->
  <g transform="translate(460, 300)">
    <line x1="20" y1="20" x2="20" y2="120" stroke="#34d399" stroke-width="1.5" />
    <rect x="13" y="40" width="14" height="50" fill="#10b981" rx="2" />

    <line x1="55" y1="15" x2="55" y2="115" stroke="#ef4444" stroke-width="1.5" />
    <rect x="48" y="30" width="14" height="65" fill="#ef4444" rx="2" />

    <line x1="90" y1="35" x2="90" y2="125" stroke="#34d399" stroke-width="1.5" />
    <rect x="83" y="50" width="14" height="45" fill="#10b981" rx="2" />

    <line x1="125" y1="25" x2="125" y2="110" stroke="#34d399" stroke-width="1.5" />
    <rect x="118" y="35" width="14" height="60" fill="#10b981" rx="2" />

    <line x1="160" y1="10" x2="160" y2="130" stroke="#34d399" stroke-width="1.5" />
    <rect x="153" y="20" width="14" height="85" fill="#10b981" rx="2" />

    <!-- EMA curve overlay -->
    <path d="M 0 85 Q 50 75, 90 65 T 160 40 T 230 30" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <text x="180" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">EMA 21</text>
  </g>
</svg>
