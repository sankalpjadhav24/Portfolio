  <text x="316" y="167" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f8fafc">• α-β Pruning Optimization</text>
  <text x="316" y="189" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">• Dynamic Depth Adaptation</text>
