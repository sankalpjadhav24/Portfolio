  <rect x="600" y="100" width="160" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="600" y="100" width="160" height="32" rx="8" fill="#1e293b" />
  <text x="614" y="122" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" font-weight="bold">03 :: DISPATCH</text>
  <text x="614" y="152" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• Pygame Renderer</text>
  <text x="614" y="174" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• ModernGL/OpenGL</text>
  <text x="614" y="196" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• Event Dispatcher</text>
  <text x="614" y="218" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• 60 FPS Target Loop</text>

