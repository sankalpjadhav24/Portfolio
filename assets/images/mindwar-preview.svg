  <text x="120" y="50" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94a3b8" letter-spacing="0.5">mindwar_engine :: core_loop [Minimax + AlphaBeta] :: 9 Games</text>
  <rect x="660" y="34" width="94" height="24" rx="4" fill="#0369a1" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="0.8" />
