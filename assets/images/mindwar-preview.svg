  <line x1="250" y1="387" x2="310" y2="415" stroke="#38bdf8" stroke-width="1.5" />
  
  <rect x="165" y="415" width="30" height="18" rx="3" fill="#1e293b" stroke="#475569" />
  <text x="180" y="428" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">+14</text>
  
  <rect x="235" y="415" width="30" height="18" rx="3" fill="#1e293b" stroke="#475569" />
  <text x="250" y="428" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">+8</text>

  <rect x="295" y="415" width="30" height="18" rx="3" fill="#0369a1" stroke="#38bdf8" />
  <text x="310" y="428" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">+42*</text>

  <!-- Annotation -->
  <text x="60" y="315" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" font-weight="bold">ALGORITHM TELEMETRY</text>
