  <!-- Architecture Flow -->
  <!-- Module 1: Board State Engine -->
  <rect x="40" y="100" width="200" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="40" y="100" width="200" height="32" rx="8" fill="#1e293b" />
  <text x="56" y="122" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" font-weight="bold">01 :: STATE MANAGER</text>
  <text x="56" y="152" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• 9 Strategy Rulesets</text>
  <text x="56" y="174" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• Turn Validation Loop</text>
