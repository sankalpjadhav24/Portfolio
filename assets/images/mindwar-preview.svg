  <text x="60" y="352" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Branch Pruning: Active</text>
  <text x="60" y="369" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">Optimal Move: [2, 4] -> score +42</text>
