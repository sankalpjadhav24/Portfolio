  <text x="400" y="320" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">MAX</text>
  
  <!-- Level 1 branches -->
  <line x1="400" y1="329" x2="250" y2="365" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="400" y1="329" x2="400" y2="365" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="400" y1="329" x2="550" y2="365" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" />

